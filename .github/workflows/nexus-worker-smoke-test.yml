name: Smoke test NEXUS Worker (temporario)

on:
  push:
    branches:
      - feat/monitoramento-acessos

permissions:
  contents: read

jobs:
  teste:
    if: "${{ github.event.head_commit.message == 'test: revalidar gravacao NEXUS Worker' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Enviar registro ficticio
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(printf '{"data_hora_cliente":"%s","usuario_nexus":"TESTE-AUTOMATIZADO","computador":"GITHUB-ACTIONS-TESTE","usuario_windows":"USUARIO-FICTICIO","sistema_operacional":"AMBIENTE-TESTE"}' "$timestamp")"
          codigo="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --retry 0 \
            -o /tmp/worker-body.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST --data "$payload" \
            'https://nexus-logs.caiocesar1214.workers.dev/nexus/access')"
          echo "STATUS_HTTP=$codigo"
          if [[ "$codigo" != "204" ]]; then
            echo "::error::Worker retornou $codigo em vez de 204"
            exit 1
          fi
